<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="description" content="Nori es un estudio de animación vectorial y motion design en el navegador. Capas, fotogramas clave, curvas de suavizado, importación de Lottie y exportación a GIF, MP4, WebM y SVG, sin servidores externos ni suscripciones." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nori — Animación vectorial en el navegador" />
    <meta property="og:description" content="Da movimiento a tus ideas sin instalar nada. Sin servidores externos, sin suscripciones. Tus animaciones y tus archivos te pertenecen." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nori — Animación vectorial en el navegador" />
    <meta name="twitter:description" content="Da movimiento a tus ideas sin instalar nada. Sin servidores externos, sin suscripciones. Tus animaciones y tus archivos te pertenecen." />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Nori</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1a1d23" />
    <meta name="msapplication-TileColor" content="#1a1d23" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Nori" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/mobile-icon.png" />
    <script>
      // Prevent FOUC: apply theme before first paint
      (function() {
        var theme = localStorage.getItem('nori-theme') || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body class="antialiased select-none overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
